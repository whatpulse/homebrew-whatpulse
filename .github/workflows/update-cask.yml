name: Update WhatPulse Cask

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'New WhatPulse version (e.g., 5.5.3)'
        required: true
        type: string

  # API trigger for external release pipelines
  repository_dispatch:
    types: [update-cask]

jobs:
  update-cask:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: No version specified"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Updating to version: $VERSION"

      - name: Download DMGs and calculate hashes
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "Downloading ARM DMG..."
          curl -L -o whatpulse-arm.dmg "https://releases.whatpulse.org/latest/macos-arm/whatpulse-mac-arm-${VERSION}.dmg"

          echo "Downloading Intel DMG..."
          curl -L -o whatpulse-intel.dmg "https://releases.whatpulse.org/latest/macos/whatpulse-mac-${VERSION}.dmg"

          # Verify downloads succeeded (check file size > 0)
          if [ ! -s whatpulse-arm.dmg ]; then
            echo "Error: ARM DMG download failed or is empty"
            exit 1
          fi

          if [ ! -s whatpulse-intel.dmg ]; then
            echo "Error: Intel DMG download failed or is empty"
            exit 1
          fi

          ARM_SHA256=$(sha256sum whatpulse-arm.dmg | cut -d' ' -f1)
          INTEL_SHA256=$(sha256sum whatpulse-intel.dmg | cut -d' ' -f1)

          echo "ARM SHA256: $ARM_SHA256"
          echo "Intel SHA256: $INTEL_SHA256"

          echo "arm_sha256=$ARM_SHA256" >> $GITHUB_OUTPUT
          echo "intel_sha256=$INTEL_SHA256" >> $GITHUB_OUTPUT

      - name: Update cask file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARM_SHA256="${{ steps.hashes.outputs.arm_sha256 }}"
          INTEL_SHA256="${{ steps.hashes.outputs.intel_sha256 }}"

          CASK_FILE="Casks/whatpulse.rb"

          # Update version
          sed -i "s/version '[^']*'/version '${VERSION}'/" "$CASK_FILE"

          # Update ARM sha256 (first occurrence after on_arm)
          sed -i "/on_arm do/,/end/ s/sha256 '[^']*'/sha256 '${ARM_SHA256}'/" "$CASK_FILE"

          # Update Intel sha256 (after on_intel)
          sed -i "/on_intel do/,/end/ s/sha256 '[^']*'/sha256 '${INTEL_SHA256}'/" "$CASK_FILE"

          echo "Updated cask file:"
          cat "$CASK_FILE"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="update-whatpulse-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add Casks/whatpulse.rb
          git commit -m "Update WhatPulse to version ${VERSION}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Update WhatPulse to version ${VERSION}" \
            --body "This PR updates the WhatPulse cask to version ${VERSION}.

          ## Changes
          - Updated version to \`${VERSION}\`
          - Updated ARM SHA256 to \`${{ steps.hashes.outputs.arm_sha256 }}\`
          - Updated Intel SHA256 to \`${{ steps.hashes.outputs.intel_sha256 }}\`

          ---
          *Automatically generated by the update-cask workflow.*" \
            --base main \
            --head "$BRANCH"
